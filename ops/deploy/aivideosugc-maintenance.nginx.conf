# Aidreamcapes maintenance page.
#
# Include this file inside the `server { server_name www.aivideosugc.com; ... }`
# block. Use the unique `location /_protected-customer-assets/` line as the
# anchor so the include does not land in the apex redirect server block:
#
#   include /www/server/nginx/conf/aivideosugc-maintenance.conf;
#
#   location /_protected-customer-assets/ { ... }
#
# Keep this file outside /www/server/panel/vhost/nginx/. BT panel auto-includes
# every *.conf in that directory at http level, where `location` is not allowed.
#
# During a release restart the Next.js process is briefly unavailable. Nginx
# converts the upstream connection failure (502/504) into a 503 page that
# users can read, instead of the default nginx error page.
#
# Deliberately do not enable `proxy_intercept_errors`: an application 503
# (for example an API response) must pass through unchanged, not be replaced
# by this HTML page.

error_page 502 503 504 =503 /__maintenance;

location = /__maintenance {
    internal;
    root /www/wwwroot/aidreamcapes.com/maintenance;
    try_files /maintenance.html =503;
    charset utf-8;

    # A temporary outage must not be cached by browsers or the CDN. The 503
    # status plus Retry-After is the SEO signal; the HTML also carries a
    # meta robots noindex as a fallback if the status is ever misconfigured.
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log off;
}
