server {
    listen 80;
    server_name aidreamcapes.eu;
    return 301 https://aidreamcapes.eu$request_uri;
}

server {
    listen 80;
    server_name www.aidreamcapes.eu;
    return 301 https://aidreamcapes.eu$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aidreamcapes.eu;

    ssl_certificate /www/server/panel/vhost/cert/aidreamcapes.eu/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aidreamcapes.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    # Public assets bypass the Next.js process and live outside code releases.
    # The relative public/ path is preserved in shared/public-static.
    location ^~ /assets/ {
        root /www/wwwroot/aidreamcapes.eu/shared/public-static;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /site-media/ {
        root /www/wwwroot/aidreamcapes.eu/shared/public-static;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /themes/ {
        root /www/wwwroot/aidreamcapes.eu/current/public;
        try_files $uri =404;
        expires 5m;
        access_log off;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|m4a|m4v|mov|mp3|mp4|ogg|png|svg|wav|webm|webp)$ {
        root /www/wwwroot/aidreamcapes.eu/shared/public-static;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/aidreamcapes.eu.log;
    error_log /www/wwwlogs/aidreamcapes.eu.error.log;
}

server {
    listen 443 ssl http2;
    server_name www.aidreamcapes.eu;

    ssl_certificate /www/server/panel/vhost/cert/aidreamcapes.eu/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aidreamcapes.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    return 301 https://aidreamcapes.eu$request_uri;
}
