server {
    listen 80;
    server_name aidreamshoots.eu www.aidreamshoots.eu;
    return 301 https://aidreamshoots.eu$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aidreamshoots.eu;

    # Verified against the live vhost. Cloudflare terminates the public
    # certificate; the origin currently reuses this existing certificate.
    ssl_certificate /www/server/panel/vhost/cert/aidreamcapes.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aidreamcapes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    location /_protected-customer-assets/ {
        internal;
        alias /www/wwwroot/mydreamshoots.com/shared/customer-assets/;
        sendfile on;
    }

    # Public assets bypass the Next.js process and live outside code releases.
    # The relative public/ path is preserved in shared/public-static.
    location ^~ /assets/ {
        root /www/wwwroot/aidreamshoots.eu/shared/public-static;
        try_files $uri =404;
        expires 1y;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /site-media/ {
        root /www/wwwroot/aidreamshoots.eu/shared/public-static;
        try_files $uri =404;
        expires 1y;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|m4a|m4v|mov|mp3|mp4|ogg|png|svg|wav|webm|webp)$ {
        root /www/wwwroot/aidreamshoots.eu/shared/public-static;
        try_files $uri =404;
        expires 1y;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=1800" always;
        add_header CDN-Cache-Control "public, s-maxage=300, stale-while-revalidate=1800" always;
        add_header Cloudflare-CDN-Cache-Control "public, s-maxage=300, stale-while-revalidate=1800" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/aidreamshoots.eu.log;
    error_log /www/wwwlogs/aidreamshoots.eu.error.log;
}

server {
    listen 443 ssl http2;
    server_name www.aidreamshoots.eu;

    ssl_certificate /www/server/panel/vhost/cert/aidreamcapes.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/aidreamcapes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    return 301 https://aidreamshoots.eu$request_uri;
}
