<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>We'll be back shortly · AIVideosUGC</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5b6774;
      --line: rgba(23, 32, 42, .10);
      --card: rgba(255, 255, 255, .94);
      --accent: #f26b4f;
      --accent-dark: #d9553b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(242, 107, 79, .20), transparent 34%),
        radial-gradient(circle at 88% 84%, rgba(72, 132, 214, .20), transparent 38%),
        #f6f7fa;
    }

    .card {
      width: min(580px, 100%);
      padding: 44px 36px 36px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(23, 32, 42, .12);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--accent), #ff9a63);
      box-shadow: 0 12px 28px rgba(242, 107, 79, .28);
    }

    .mark svg { width: 26px; height: 26px; display: block; }

    .brand {
      margin: 0 0 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 7px 12px;
      border: 1px solid rgba(242, 107, 79, .22);
      border-radius: 999px;
      background: rgba(242, 107, 79, .08);
      font-size: 12px;
      font-weight: 650;
      color: var(--accent-dark);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(242, 107, 79, .12);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 6vw, 42px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .lead {
      margin: 0 auto 28px;
      max-width: 42ch;
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }

    .button:hover {
      background: #26313d;
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(242, 107, 79, .45);
      outline-offset: 3px;
    }

    .help {
      margin: 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }

    .help a {
      color: var(--ink);
      font-weight: 650;
      text-decoration: underline;
      text-decoration-color: rgba(23, 32, 42, .25);
      text-underline-offset: 3px;
    }

    .help a:hover { text-decoration-color: var(--ink); }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .card { padding: 34px 22px 28px; border-radius: 20px; }
      .lead { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 5.5v13l10-6.5-10-6.5Z" fill="#fff"/>
      </svg>
    </div>
    <p class="brand">AIVideosUGC</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Temporary maintenance</div>
    <h1>We're making a few updates</h1>
    <p class="lead">The site will be back in a few minutes. Thanks for your patience.</p>
    <div class="actions">
      <a class="button" href="/">Try again</a>
    </div>
    <p class="help">Need help? <a href="mailto:support@aivideosugc.com">support@aivideosugc.com</a></p>
  </main>
</body>
</html>
