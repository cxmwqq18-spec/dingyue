services:
  postgres:
    image: postgres:16-alpine
    container_name: dingyue-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-dingyue_local}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-dingyue_local}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-dingyue_local_dev}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - dingyue-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dingyue-local-postgres:
